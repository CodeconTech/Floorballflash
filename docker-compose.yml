# Kör appen bakom Caddy, som hämtar HTTPS-certifikat automatiskt.
# Sätt DOMAIN och PUBLIC_URL i .env och starta med: docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
      # Appen ligger bakom Caddy; behövs för att se besökarnas riktiga IP-adress.
      TRUST_PROXY: "1"
    volumes:
      # Databas och filmklipp. Lägg dem gärna utanför kodmappen (DATA_PATH i .env),
      # så kan inget git-kommando eller en ny utcheckning av koden röra dem.
      - ${DATA_PATH:-./data}:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Sätt DOMAIN i .env, t.ex. DOMAIN=floorballflash.example.se}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Egen Caddy-konfiguration (t.ex. med fler sajter på samma server): sätt CADDYFILE i .env,
      # t.ex. CADDYFILE=./Caddyfile.local, i stället för att ändra Caddyfile.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Låter Caddy nå tjänster som körs direkt på servern (host.docker.internal:PORT).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
