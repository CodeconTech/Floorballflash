<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floorballflash – spelprogram och resultat</title>
  <meta name="description" content="Spelprogram, liveresultat och filmklipp från lagets innebandymatcher.">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏑%3C/text%3E%3C/svg%3E">
  <script src="/common.js" defer></script>
  <script src="/index.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🏑 Floorballflash</a>
    <nav id="nav"></nav>
  </header>
  <main>
    <div id="live-now"></div>

    <div class="section-head">
      <h2>Kommande matcher</h2>
      <span class="muted" id="updated"></span>
    </div>
    <div id="upcoming" class="matches"><div class="empty">Hämtar spelprogram…</div></div>

    <div class="section-head"><h2>Resultat</h2></div>
    <div id="played" class="matches"></div>

    <div class="section-head" id="klipp">
      <h2>Senaste klippen</h2>
    </div>
    <div id="latest-videos" class="videos"></div>
  </main>
  <footer>Data från <a href="https://stats.innebandy.se/" rel="noopener">stats.innebandy.se</a> · uppdateras live</footer>
</body>
</html>
